[package]
name = "amp-linux-desktop"
description = "Native GTK 4 desktop app for Amp, the coding agent at ampcode.com"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["huddles"]
# Huddles link libwebrtc through the LiveKit SDK; its build downloads a prebuilt libwebrtc.
huddles = ["dep:amp-huddle"]

[dependencies]
adw.workspace = true
amp-common.workspace = true
amp-dictation.workspace = true
amp-huddle = { workspace = true, optional = true }
async-channel.workspace = true
base64.workspace = true
getrandom = "0.3"
gtk.workspace = true
libc.workspace = true
log.workspace = true
rusqlite = "0.37"
serde_json.workspace = true
url.workspace = true
# 2.42: ClipboardPermissionRequest.
webkit = { package = "webkit6", version = "0.6", features = ["v2_42"] }
