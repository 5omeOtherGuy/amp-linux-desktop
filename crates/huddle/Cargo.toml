[package]
name = "amp-huddle"
description = "Huddles through the LiveKit SDK, for WebKitGTK builds without WebRTC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
adw.workspace = true
async-channel.workspace = true
gst.workspace = true
gst-app.workspace = true
futures-util = "0.3"
gtk.workspace = true
livekit = { version = "0.10", default-features = false, features = ["native", "rustls-tls-webpki-roots"] }
log.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
