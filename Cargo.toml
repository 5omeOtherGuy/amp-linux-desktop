[workspace]
# Split so that a change recompiles one crate: the app and its bridge (crates/app), the parts
# without GTK (crates/common), dictation over GStreamer (crates/dictation), and Huddles over
# LiveKit (crates/huddle), which links libwebrtc.
members = ["crates/app", "crates/common", "crates/dictation", "crates/huddle"]
default-members = ["crates/app"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
# The newest rust-version among the dependencies (kstring).
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/5omeOtherGuy/amp-linux-desktop"

[workspace.dependencies]
amp-common = { path = "crates/common" }
amp-dictation = { path = "crates/dictation" }
amp-huddle = { path = "crates/huddle" }
adw = { package = "libadwaita", version = "0.9", features = ["v1_2"] }
async-channel = "2"
base64 = "0.22"
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
gst = { package = "gstreamer", version = "0.25" }
gst-app = { package = "gstreamer-app", version = "0.25" }
libc = "0.2"
log = { version = "0.4", features = ["std"] }
serde_json = { version = "1", features = ["preserve_order"] }
url = "2"

# Debug builds are for iterating: file and line backtraces, but no full debug info to write and
# link.
[profile.dev]
debug = "line-tables-only"
